[package]
name = "rs-yt-player"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "YouTubeAudioPlayer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
tokio-util = { version = "0.7", features = ["io"] }
symphonia = { version = "0.5", features = ["all"] }
slint = "1.9"
i-slint-backend-winit = "1.9"
raw-window-handle = "0.6"
tray-icon = "0.19"
muda = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
souvlaki = "0.7"
windows = { version = "0.54", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Media_Control"] }

[build-dependencies]
slint-build = "1.9"
winres = "0.1.12"
